[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epochmatch"
version = "0.1.0"
description = "Cross-match two astronomical catalogues at a common epoch, using proper motions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RakTikoo"}]
keywords = ["astronomy", "astrophysics", "cross-match", "catalogue", "proper motion", "astropy"]
dependencies = [
    "astropy>=6",
    "numpy",
    "scipy>=1.10",
]

[project.scripts]
epochmatch = "epochmatch.cli:main"

[tool.setuptools.packages.find]
include = ["epochmatch*"]
